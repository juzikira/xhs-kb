<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小红书知识库</title>
<style>
:root{
  --bg:#F6F1E7; --surface:#FFFFFF; --surface-2:#FBF7EF; --ink:#1F1B16; --ink-2:#4A4239;
  --muted:#8A7E6F; --faint:#B3A796; --line:#E9E1D3; --line-2:#F1EADB; --accent:#C55221;
  --accent-2:#CC8800; --accent-soft:#F4E6D8; --good:#16A34A; --warn:#D97706; --bad:#DC2626;
  --shadow:0 1px 2px rgba(31,27,22,.05),0 8px 24px rgba(31,27,22,.06);
  --shadow-hi:0 3px 8px rgba(31,27,22,.09),0 18px 40px rgba(31,27,22,.11);
  --r:18px; --r-sm:11px; --r-xs:8px;
  --serif:Georgia,"Songti SC","STSong","Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Pingfang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
[data-theme="dark"]{
  --bg:#15120D; --surface:#1E1A14; --surface-2:#242019; --ink:#F1E9DC; --ink-2:#BCAE9C;
  --muted:#8E8270; --faint:#6B6151; --line:#2E281F; --line-2:#271F18; --accent:#E0743A;
  --accent-2:#E0A23C; --accent-soft:#3A2A1C; --good:#3FB968; --warn:#E2A23C; --bad:#E8705C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --shadow-hi:0 3px 8px rgba(0,0,0,.4),0 18px 40px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
  line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent-soft)}
button{font-family:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:284px 1fr;height:100vh;overflow:hidden}

/* ---------- Sidebar ---------- */
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
.brand{padding:20px 22px 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:19px;margin:0;letter-spacing:.4px}
.brand .sub{color:var(--muted);font-size:11.5px;margin-top:3px;letter-spacing:.2px}
.themebtn{border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
  width:32px;height:32px;border-radius:10px;font-size:15px;display:flex;align-items:center;justify-content:center;transition:.15s}
.themebtn:hover{border-color:var(--accent);color:var(--accent)}
.searchwrap{padding:0 18px 12px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:12px;padding:9px 12px;transition:.18s}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{flex:0 0 auto;opacity:.5}
.search input{flex:1;border:0;background:transparent;outline:0;font-size:13.5px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.search kbd{font-size:10px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:var(--sans)}
.nav{flex:1;overflow-y:auto;padding:4px 12px 24px}
.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.navitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:11px;cursor:pointer;
  color:var(--ink-2);font-size:13.5px;transition:.14s;user-select:none}
.navitem:hover{background:var(--surface-2)}
.navitem.active{background:var(--ink);color:#fff}
.navitem .ic{width:20px;text-align:center;font-size:14px;flex:0 0 auto}
.navitem .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navitem .ct{font-size:11px;color:var(--muted);background:var(--line-2);padding:1px 8px;border-radius:20px}
.navitem.active .ct{background:rgba(255,255,255,.18);color:#fff}
.navitem .ct.warn{color:var(--warn)}
.navsec{font-size:10.5px;letter-spacing:1.6px;color:var(--faint);text-transform:uppercase;margin:16px 12px 6px;font-weight:700}
.coll-row{display:flex;align-items:center;gap:6px}
.coll-row .del{margin-left:auto;opacity:0;color:var(--faint);font-size:13px;padding:0 4px;border-radius:6px}
.navitem:hover .coll-row .del{opacity:1}
.coll-row .del:hover{color:var(--bad)}
.coll-add{display:flex;gap:6px;padding:6px 12px}
.coll-add input{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:9px;
  padding:7px 10px;font-size:12.5px;color:var(--ink);outline:0}
.coll-add input:focus{border-color:var(--accent)}
.coll-add button{border:1px solid var(--line);background:var(--surface-2);color:var(--accent);
  border-radius:9px;padding:0 12px;font-size:16px;font-weight:600}
.tagcloud{padding:4px 12px 10px;display:flex;flex-wrap:wrap;gap:6px}
.tagcloud .t{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);
  padding:3px 9px;border-radius:18px;cursor:pointer;transition:.14s;user-select:none}
.tagcloud .t:hover{border-color:var(--accent);color:var(--accent)}
.tagcloud .t.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp{margin-bottom:2px}
.grp-head{display:flex;align-items:center;gap:8px;padding:11px 12px 7px;cursor:pointer;
  font-size:11.5px;letter-spacing:.6px;color:var(--muted);font-weight:700;user-select:none;transition:.14s}
.grp-head:hover{color:var(--ink-2)}
.grp-head .chev{margin-left:auto;font-size:9px;transition:transform .2s;opacity:.55}
.grp.collapsed .chev{transform:rotate(-90deg)}
.grp.collapsed .grp-body{display:none}
.grp-body{padding-bottom:4px}
.grp-sep{height:1px;background:var(--line);margin:13px 12px 7px}
.navitem.sub{padding-left:30px;font-size:13px;color:var(--muted)}
.navitem.sub .ic{font-size:12px}

/* ---------- Main ---------- */
.main{display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:18px 28px 10px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.topbar .title{font-family:var(--serif);font-size:22px;font-weight:600}
.topbar .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:6px 12px;border-radius:8px;transition:.14s}
.seg button.on{background:var(--ink);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:10px;
  padding:7px 13px;font-size:12.5px;transition:.15s;display:flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-2);color:#fff}
.navtoggle{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:18px;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto}
.navtoggle:hover{border-color:var(--accent);color:var(--accent)}
.scrim{display:none}
.sort{appearance:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;
  padding:7px 28px 7px 12px;font-size:12.5px;color:var(--ink-2);cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%238C857A' fill='none' stroke-width='1.4'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center}
.sort:focus{outline:none;border-color:var(--accent)}

.tagbar{padding:2px 28px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tagbar .lab{font-size:12px;color:var(--muted);margin-right:2px}
.chip{font-size:12.5px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);cursor:pointer;transition:.15s;user-select:none;white-space:nowrap}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .n{opacity:.55;margin-left:5px;font-size:11px}
.chip.on .n{opacity:.7}
.clearf{font-size:12px;color:var(--accent);cursor:pointer;margin-left:4px;display:none}
.clearf.show{display:inline}

/* organize bulk bar */
.bulkbar{margin:0 28px 12px;display:none;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 14px}
.bulkbar.show{display:flex}
.bulkbar .cnt{font-weight:600;color:var(--accent);font-size:13px}
.bulkbar input{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--ink);outline:0;width:120px}
.bulkbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 10px;font-size:12.5px;color:var(--ink);outline:0}
.bulkbar .mini{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);border-radius:9px;padding:6px 11px;font-size:12.5px}
.bulkbar .mini:hover{border-color:var(--accent);color:var(--accent)}
.bulkbar .mini.danger:hover{border-color:var(--bad);color:var(--bad)}

.scroll{flex:1;overflow-y:auto;padding:2px 28px 44px}
.scroll::-webkit-scrollbar{width:10px}.scroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:18px}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hi);border-color:var(--line)}
.card .pick{position:absolute;left:10px;top:10px;z-index:4;width:22px;height:22px;border-radius:7px;
  border:2px solid #fff;background:rgba(0,0,0,.25);display:none;align-items:center;justify-content:center;color:#fff;font-size:13px}
.organize .card .pick{display:flex;cursor:pointer}
.card.picked .pick{background:var(--accent);border-color:var(--accent)}
.card .acts{position:absolute;right:10px;top:10px;z-index:4;display:flex;gap:6px;opacity:0;transition:.15s}
.card:hover .acts{opacity:1}
.card .acts button{width:28px;height:28px;border-radius:9px;border:0;background:rgba(255,255,255,.92);
  backdrop-filter:blur(4px);color:var(--ink-2);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.12)}
.card .acts button:hover{color:var(--accent)}
.cover{position:relative;aspect-ratio:4/3;background:var(--line-2);overflow:hidden}
.cover .fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;opacity:.5}
.cover .fb .fi{font-size:36px}
.cover .fb .ft{font-size:12px;color:var(--ink-2);letter-spacing:.5px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:4px 9px;border-radius:20px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.heat{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;color:#fff;letter-spacing:.3px}
.body{padding:12px 14px 13px;display:flex;flex-direction:column;gap:7px;flex:1}
.ttl{font-size:13.5px;line-height:1.45;font-weight:500;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:38px}
.author{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.author .at{opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.tg{font-size:11px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line-2);padding:2px 8px;border-radius:7px}
.foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:9px;margin-top:2px}
.likes{font-size:12px;color:var(--bad);font-weight:600;display:flex;align-items:center;gap:4px}
.conf{width:7px;height:7px;border-radius:50%;background:var(--line);flex:0 0 auto}
.conf.low{background:var(--warn)}
.acc-pill{font-size:10.5px;padding:1px 7px;border:1px solid var(--line-2);border-radius:9px;margin-left:5px;white-space:nowrap;flex:0 0 auto;background:var(--surface-2)}

/* board view */
.board{display:flex;gap:16px;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.board .col{flex:0 0 250px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px}
.board .col h3{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:7px}
.board .col h3 .ci{font-size:14px}
.board .col h3 .cc{margin-left:auto;color:var(--muted);font-size:11px}
.board .mini{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;margin-bottom:9px;display:block;transition:.15s}
.board .mini:hover{box-shadow:var(--shadow);border-color:var(--accent)}
.board .mini .mt{font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.board .mini .ma{font-size:11px;color:var(--muted);margin-top:5px}

/* table view */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line-2)}
.tbl th{color:var(--muted);font-weight:600;font-size:12px;cursor:pointer;position:sticky;top:0;background:var(--bg);user-select:none;white-space:nowrap}
.tbl th:hover{color:var(--accent)}
.tbl td .tcell{display:flex;align-items:center;gap:10px}
.tbl td .tthumb{width:42px;height:32px;border-radius:6px;object-fit:cover;background:var(--line-2);flex:0 0 auto}
.tbl td .tt{font-weight:500;color:var(--ink);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.tbl tr:hover td{background:var(--surface-2)}
.tbl .pk{width:22px}
.tbl .pkbox{width:18px;height:18px;border-radius:6px;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px;cursor:pointer}
.tbl tr.picked .pkbox{background:var(--accent);border-color:var(--accent)}
.organize .tbl .pkbox{cursor:pointer}

/* overview dashboard */
.ov{display:grid;gap:18px}
.ov .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.ov .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.ov .kpi .n{font-family:var(--serif);font-size:30px;font-weight:600}
.ov .kpi .l{color:var(--muted);font-size:12.5px;margin-top:2px}
.ov .panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.ov .panel h2{font-family:var(--serif);font-size:16px;margin:0 0 14px;font-weight:600}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:9px;font-size:13px}
.bar .bn{width:130px;color:var(--ink-2);display:flex;align-items:center;gap:6px;flex:0 0 auto}
.bar .bt{flex:1;height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
.bar .bf{height:100%;border-radius:6px;background:var(--accent);transition:width .5s}
.bar .bv{width:42px;text-align:right;color:var(--muted);font-size:12px;flex:0 0 auto}
.ov .twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.ov .twocol{grid-template-columns:1fr}}

.empty{padding:70px 20px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--serif);font-size:18px;color:var(--ink-2);margin-bottom:6px}

/* modal */
.modal{position:fixed;inset:0;background:rgba(20,18,14,.5);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;z-index:50;padding:24px}
.modal.show{display:flex}
.mcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;max-width:560px;width:100%;
  max-height:86vh;overflow-y:auto;box-shadow:var(--shadow-hi)}
.mcard .mcover{aspect-ratio:16/9;background:var(--line-2);position:relative}
.mcard .mcover img{width:100%;height:100%;object-fit:cover;display:block}
.mcard .mbody{padding:18px 22px 22px}
.mcard .mt{font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.4}
.mcard .ma{color:var(--muted);font-size:13px;margin:6px 0 14px}
.mcard .mrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.mcard .mfield{margin-bottom:13px}
.mcard .mfield label{font-size:12px;color:var(--muted);display:block;margin-bottom:5px}
.mcard select,.mcard input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:9px 11px;font-size:13px;color:var(--ink);outline:0;font-family:inherit}
.mcard select:focus,.mcard input:focus{border-color:var(--accent)}
.mcard .mactions{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}
.mcard .mactions .btn{flex:1;justify-content:center}
.mclose{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(255,255,255,.9);color:var(--ink);font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.15);z-index:2}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);
  color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60;box-shadow:var(--shadow-hi)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Star / account mgr / import preview ---------- */
.navitem .acc-mgr{margin-left:auto;opacity:0;color:var(--faint);font-size:12px;padding:0 5px;border-radius:6px;transition:.14s}
.navitem:hover .acc-mgr{opacity:1}
.navitem .acc-mgr:hover{color:var(--accent)}
.card.stared{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card .acts button[data-act="star"]{color:var(--accent-2)}
.card.stared .acts button[data-act="star"]{background:var(--accent-2);color:#fff}
.impBody{max-height:46vh;overflow:auto;margin:6px 0 14px}
.impAcc{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--surface-2)}
.impAcc .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.impAcc .h .dot{width:9px;height:9px;border-radius:50%}
.impAcc .sum{font-size:12px;color:var(--muted);margin-bottom:8px}
.impAcc .cats{display:flex;flex-wrap:wrap;gap:6px}
.impAcc .cats span{font-size:11px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:14px}
.impNote{color:var(--warn);font-size:12px;padding:8px 12px;text-align:center}

/* ---------- Responsive: auto-fit phone / tablet / desktop ---------- */
@media(max-width:1024px){
  .app{grid-template-columns:1fr;height:100vh}
  .side{position:fixed;top:0;left:0;bottom:0;width:280px;z-index:45;transform:translateX(-100%);
    transition:transform .26s ease;box-shadow:0 0 50px rgba(0,0,0,.22);overflow-y:auto;border-right:0}
  .app.nav-open .side{transform:translateX(0)}
  .nav{max-height:none}
  .navtoggle{display:flex}
  .scrim{display:block;position:fixed;inset:0;background:rgba(20,18,14,.42);z-index:44;opacity:0;pointer-events:none;transition:opacity .22s}
  .app.nav-open .scrim{opacity:1;pointer-events:auto}
  .topbar,.tagbar,.scroll,.bulkbar{padding-left:16px;padding-right:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:14px}
  .ov .twocol{grid-template-columns:1fr}
}
@media(max-width:600px){
  .side{width:84vw;max-width:320px}
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .topbar{gap:10px}
  .topbar .tools{gap:6px}
  .topbar .title{font-size:18px}
  .brand h1{font-size:16px}
  .btn{padding:7px 10px;font-size:12px}
  .sort{padding:7px 24px 7px 10px}

    var s=state.sort;
    list.sort(function(a,b){
      var sa=starred.has(a.id)?1:0, sb=starred.has(b.id)?1:0;
      if(sa!==sb) return sb-sa;
      if(s==='heat')return (b.likes||0)-(a.likes||0);if(s==='title')return a.title.localeCompare(b.title,'zh');return (b.savedAt||'').localeCompare(a.savedAt||'');});
    return list;
  }

  /* ---------- Cards ---------- */
  function card(n){
    var cm=CATMETA[n.cat]||{icon:'•',color:'#999'};
    var tags=(n.tags||[]).slice(0,3).map(function(t){return '<span class="tg">'+esc(t)+'</span>';}).join('');
    var heat=HEAT[n.heat]||'#A9A39A';
    var isDead=coverDead.has(n.id);
    var confCls=n.conf==='low'?'conf low':'conf';
    var coverHtml = n.cover
      ? '<img loading="lazy" src="'+esc(n.cover)+'" alt="" onerror="markDead(\''+esc(n.id)+'\')">'
      : fb(cm);
    if(isDead && n.cover) coverHtml = fb(cm);
    return '<a class="card'+(sel.has(n.id)?' picked':'')+(starred.has(n.id)?' stared':'')+'" data-id="'+esc(n.id)+'" href="'+esc(n.url)+'" target="_blank" rel="noopener">'+
      '<div class="pick" data-pick="'+esc(n.id)+'">✓</div>'+
      '<div class="acts">'+
        '<button data-act="star" data-id="'+esc(n.id)+'" title="星标">★</button>'+
        '<button data-act="view" data-id="'+esc(n.id)+'" title="详情">👁</button>'+
        '<button data-act="coll" data-id="'+esc(n.id)+'" title="加入合集">❏</button>'+
        '<button data-act="hide" data-id="'+esc(n.id)+'" title="标记失效">⊘</button>'+
      '</div>'+
      '<div class="cover" style="background:'+cm.color+'1A">'+coverHtml+
        '<span class="badge" style="color:'+cm.color+'"><span>'+cm.icon+'</span>'+esc(n.cat)+'</span>'+
        '<span class="heat" style="background:'+heat+'">'+esc(n.heat||'')+'</span>'+
      '</div>'+
      '<div class="body"><div class="ttl">'+hl(n.title)+'</div>'+
        '<div class="author"><span class="at">@</span>'+esc(n.author||'未知作者')+accPill(n)+'</div>'+
        (tags?'<div class="tags">'+tags+'</div>':'<div class="tags"></div>')+
        '<div class="foot"><span class="likes">♥ '+esc(n.likesText||'')+'</span><span class="'+confCls+'" title="'+(n.conf==='low'?'AI 低置信 · 待确认':'已确认')+'"></span></div>'+
      '</div></a>';
  }
  function fb(cm){return '<div class="fb" style="color:'+cm.color+'"><div class="fi">'+cm.icon+'</div><div class="ft">'+(cm.icon?esc(cm.icon):'')+'</div></div>';}
  function accPill(n){
    var a=accName(n.account||'默认');
    if(a==='默认' && accountList().length<=1) return '';
    return '<span class="acc-pill" style="border-color:'+accColor(a)+'55;color:'+accColor(a)+'">● '+esc(a)+'</span>';
  }
  window.markDead=function(id){coverDead.add(id);save(LS.dead,Array.from(coverDead));
    var im=document.querySelector('.card[data-id="'+cssEsc(id)+'"] .cover');
    if(im){var cm=CATMETA[(function(){var f=null;NOTES.forEach(function(n){if(n.id===id)f=n;});return f?f.cat:'';})()]||{icon:'•',color:'#999'};
      im.innerHTML=fb(cm);}
    if(state.view==='dead'||state.view==='all'){/* counts update lazily */} buildNav();
  };
  function cssEsc(s){return (s||'').replace(/["\\]/g,'\\$&');}

  /* ---------- Board & Table ---------- */
  function boardView(list){
    var byCat={}; list.forEach(function(n){(byCat[n.cat]=byCat[n.cat]||[]).push(n);});
    var cols=Object.keys(byCat).sort(function(a,b){return (byCat[b]||0).length-(byCat[a]||0).length;});
    if(!cols.length) return emptyHTML();
    return '<div class="board">'+cols.map(function(c){
      var cm=CATMETA[c]||{icon:'•',color:'#999'};
      var items=byCat[c].slice(0,30).map(function(n){
        return '<a class="mini" href="'+esc(n.url)+'" target="_blank" rel="noopener" data-id="'+esc(n.id)+'">'+
          '<div class="mt">'+esc(n.title)+'</div><div class="ma">@'+esc(n.author||'')+' · '+esc(n.likesText||'')+(n.account?(' · '+esc(n.account)):'')+'</div></a>';}).join('');
      return '<div class="col"><h3><span class="ci" style="color:'+cm.color+'">'+cm.icon+'</span>'+esc(c)+'<span class="cc">'+(byCat[c]||[]).length+'</span></h3>'+items+'</div>';
    }).join('')+'</div>';
  }
  function tableView(list){
    if(!list.length) return emptyHTML();
    var rows=list.map(function(n){var cm=CATMETA[n.cat]||{icon:'•',color:'#999'};
      var cov=n.cover&&!coverDead.has(n.id)?'<img class="tthumb" src="'+esc(n.cover)+'" onerror="this.style.visibility=\'hidden\'">':'';
      return '<tr data-id="'+esc(n.id)+'"'+(sel.has(n.id)?' class="picked"':'')+'>'+
        '<td class="pk"><span class="pkbox" data-pick="'+esc(n.id)+'">'+(sel.has(n.id)?'✓':'')+'</span></td>'+
        '<td><div class="tcell">'+cov+'<div><div class="tt">'+esc(n.title)+'</div><div style="font-size:11px;color:var(--muted)">@'+esc(n.author||'')+(n.account?(' · '+esc(n.account)):'')+'</div></div></div></td>'+
        '<td><span style="color:'+cm.color+';font-weight:600">'+cm.icon+' '+esc(n.cat)+'</span></td>'+
        '<td>'+esc(n.heat||'')+'</td><td style="color:var(--bad);font-weight:600">'+esc(n.likesText||'')+'</td>'+
        '<td><a href="'+esc(n.url)+'" target="_blank" rel="noopener" style="color:var(--accent)">打开 ↗</a></td></tr>';}).join('');
    return '<table class="tbl"><thead><tr><th class="pk"></th><th data-s="title">标题</th><th data-s="cat">分类</th><th data-s="heat">热度</th><th data-s="likes">点赞</th><th>链接</th></tr></thead><tbody>'+rows+'</tbody></table>';
  }
  function emptyHTML(){return '';}

  /* ---------- Overview ---------- */
  function overview(){
    var list=N();
    var byDom={},byCat={}; list.forEach(function(n){byDom[n.domain]=(byDom[n.domain]||0)+1;byCat[n.cat]=(byCat[n.cat]||0)+1;});
    var tm={}; list.forEach(function(n){(n.tags||[]).concat(n.hashtags||[]).forEach(function(t){tm[t]=(tm[t]||0)+1;});});
    var maxD=Math.max.apply(0,Object.values(byDom)), maxC=Math.max.apply(0,Object.values(byCat));
    var domBars=DOMAINS.map(function(d){var v=byDom[d.name]||0;return bar(d.name,v,maxD,'▦');}).join('');
    var catBars=Object.keys(byCat).sort(function(a,b){return byCat[b]-byCat[a];}).slice(0,12).map(function(c){
      var cm=CATMETA[c]||{icon:'•',color:'#999'};return bar(cm.icon+' '+c,byCat[c],maxC,cm.color,true);}).join('');
    var tagBars=Object.keys(tm).sort(function(a,b){return tm[b]-tm[a];}).slice(0,12).map(function(t){return bar(t,tm[t],tm[Object.keys(tm)[0]],null,false);}).join('');
    var accNames=accountList(),accMax=0;accNames.forEach(function(a){var c=accCount(a);if(c>accMax)accMax=c;});
    var accBars=accNames.map(function(a){return bar('● '+a,accCount(a),accMax,accColor(a),true);}).join('');
    var byAuthor={}; list.forEach(function(n){var a=n.author&&n.author.trim()?n.author.trim():'匿名';byAuthor[a]=(byAuthor[a]||0)+1;});
    var topAuth=Object.keys(byAuthor).sort(function(x,y){return byAuthor[y]-byAuthor[x];}).slice(0,10);
    var amax=topAuth.length?byAuthor[topAuth[0]]:0;
    var authBars=topAuth.map(function(a){return bar('@'+a,byAuthor[a],amax,'#7C8B9E',true);}).join('');
    return '<div class="ov"><div class="kpis">'+
      kpi(totNotes(),'有效收藏')+kpi(DOMAINS.length,'领域')+kpi(Object.keys(byCat).length,'分类')+
      kpi(Object.keys(tm).length,'标签')+kpi(Object.keys(byAuthor).length,'作者')+kpi(lowNotes(),'待确认')+kpi(deadNotes(),'失效')+kpi(accountList().length,'账号')+'</div>'+
      '<div class="twocol"><div class="panel"><h2>领域分布</h2>'+domBars+'</div>'+
      '<div class="panel"><h2>分类分布（Top 12）</h2>'+catBars+'</div></div>'+
      '<div class="twocol"><div class="panel"><h2>热门标签（Top 12）</h2>'+tagBars+'</div>'+
      '<div class="panel"><h2>账号分布（来源）</h2>'+accBars+'</div></div>'+
      '<div class="panel" style="grid-column:1/-1"><h2>高频作者 Top 10</h2>'+authBars+'</div></div>';
  }
  function bar(name,val,max,color,cat){var pct=max?Math.round(val/max*100):0;var c=color||'var(--accent)';
    return '<div class="bar"><span class="bn" style="'+(cat?'color:'+color:'')+'">'+esc(name)+'</span><span class="bt"><span class="bf" style="width:'+pct+'%;background:'+c+'"></span></span><span class="bv">'+val+'</span></div>';}
  function kpi(n,l){return '<div class="kpi"><div class="n">'+n+'</div><div class="l">'+esc(l)+'</div></div>';}

  /* ---------- Render ---------- */
  function render(){
    var list=filtered();
    var t, parts=[list.length+' 篇'];
    if(state.view==='review'){t='待确认 · 低置信度';}
    else if(state.view==='dead'){t='失效 · 待清理';parts=[list.length+' 条']; if(hidden.size)parts.push(hidden.size+' 已标记失效'); if(coverDead.size)parts.push(coverDead.size+' 封面失效'); if(linkDead.size)parts.push(linkDead.size+' 链接失效');}
    else if(state.view==='overview'){t='概览 · 数据看板';}
    else if(state.view.indexOf('coll:')===0){t='合集 · '+state.view.slice(5);}
    else if(state.cat){t=state.cat;}
    else if(state.domain){t=state.domain+' · 全部分类';}
    else if(state.account){t='账号 · '+state.account;}
    else {t='全部收藏';}
    $('viewTitle').textContent=t;
    if(state.tags.size)parts.push('标签 '+Array.from(state.tags).join(' / '));
    if(state.account)parts.push('账号 '+state.account);
    if(state.q)parts.push('搜索 "'+state.q+'"');
    $('viewMeta').textContent=parts.join(' · ');
    $('brandSub').textContent='共 '+totNotes()+' 篇 · '+lowNotes()+' 待确认 · '+deadNotes()+' 失效';
    document.body.classList.toggle('organize',state.organize);
    if(state.view==='overview'){grid.style.display='block';grid.innerHTML=overview();}
    else{grid.style.display='grid';
      if(state.mode==='board')grid.innerHTML=boardView(list);
      else if(state.mode==='table')grid.innerHTML=tableView(list);
      else grid.innerHTML=list.map(card).join('');}
    empty.style.display=list.length?'none':'block';
    renderTags();
    syncBulk();
    bindCardEvents();
  }
  function bindCardEvents(){
    Array.prototype.forEach.call(grid.querySelectorAll('[data-act]'),function(b){
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var id=b.getAttribute('data-id');var a=b.getAttribute('data-act');
        if(a==='view')openModal(id); else if(a==='coll')quickColl(id); else if(a==='hide')hideNote(id); else if(a==='star')toggleStar(id);});});
    Array.prototype.forEach.call(grid.querySelectorAll('[data-pick]'),function(b){
      b.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();var id=b.getAttribute('data-pick');toggleSel(id);});});
    Array.prototype.forEach.call(grid.querySelectorAll('th[data-s]'),function(th){
      th.addEventListener('click',function(){var s=th.getAttribute('data-s');
        state.sort = (s==='title')?'title':(s==='likes'?'heat':'recent');
        $('sort').value=state.sort; render();});});
  }
  function toggleSel(id){if(sel.has(id))sel.delete(id);else sel.add(id);syncBulk();
    var c=grid.querySelector('.card[data-id="'+cssEsc(id)+'"]');if(c)c.classList.toggle('picked',sel.has(id));
    var tr=grid.querySelector('tr[data-id="'+cssEsc(id)+'"]');if(tr){tr.classList.toggle('picked',sel.has(id));var pb=tr.querySelector('.pkbox');if(pb){pb.classList.toggle('picked',sel.has(id));pb.textContent=sel.has(id)?'✓':'';}}
  }
  function syncBulk(){bulkbar.classList.toggle('show',state.organize&&sel.size>0);
    $('bulkCnt').textContent='已选 '+sel.size;
    // refresh coll select
    var sel2=$('bulkColl'); var cur=sel2.value; sel2.innerHTML='<option value="">选择合集…</option>'+Object.keys(collections).map(function(cn){return '<option>'+esc(cn)+'</option>';}).join(''); sel2.value=cur;}

  /* ---------- Detail modal ---------- */
  function openModal(id){
    var n=null; NOTES.forEach(function(x){if(x.id===id)n=x;}); if(!n)return;
    var cm=CATMETA[n.cat]||{icon:'•',color:'#999'};
    var cov=n.cover&&!coverDead.has(n.id)?'<img src="'+esc(n.cover)+'" onerror="this.style.display=\'none\'">':fb(cm);
    var allCats=[];DOMAINS.forEach(function(d){d.cats.forEach(function(c){allCats.push(c);});});
    var reOpts=allCats.map(function(c){return '<option'+(c===n.cat?' selected':'')+'>'+esc(c)+'</option>';}).join('');
    var collOpts=Object.keys(collections).map(function(cn){var inC=(collections[cn]||[]).indexOf(id)>=0;return '<option value="'+esc(cn)+'">'+(inC?'✓ ':'+ ')+esc(cn)+'</option>';}).join('');
    mcard.innerHTML='<button class="mclose" id="mclose">✕</button>'+
      '<div class="mcover">'+cov+'</div>'+
      '<div class="mbody">'+
        '<div class="mt">'+esc(n.title)+'</div>'+
        '<div class="ma">@'+esc(n.author||'未知作者')+' · ♥ '+esc(n.likesText||'')+' · '+esc(n.heat||'')+' · 账号 '+esc(n.account||'默认')+'</div>'+
        '<div class="mrow">'+(n.tags||[]).concat(n.hashtags||[]).map(function(t){return '<span class="tg">'+esc(t)+'</span>';}).join('')+'</div>'+
        '<div class="mfield"><label>重新分类（纠正 AI 误判）</label><select id="mReclass">'+reOpts+'</select></div>'+
        '<div class="mfield"><label>加入合集</label><select id="mColl">'+collOpts+'</select></div>'+
        '<div class="mactions">'+
          '<button class="btn primary" id="mOpen">打开原文 ↗</button>'+
          '<button class="btn'+(starred.has(id)?' primary':'')+'" id="mStar">'+(starred.has(id)?'★ 已星标':'☆ 星标')+'</button>'+
          '<button class="btn" id="mSave">保存分类</button>'+
          (hidden.has(id)?'<button class="btn" id="mRestore">恢复</button>':'<button class="btn" id="mHide">标记失效</button>')+
        '</div>'+
      '</div>';
    modal.classList.add('show');
    $('mclose').onclick=closeModal;
    $('mOpen').onclick=function(){window.open(n.url,'_blank');};
    $('mSave').onclick=function(){var v=$('mReclass').value;if(v&&v!==n.cat){corrections[id]=v;save(LS.corr,corrections);toast('已重分类为「'+v+'」');}else{delete corrections[id];save(LS.corr,corrections);}buildNav();render();closeModal();};
    $('mColl').onchange=function(){var cn=$('mColl').value;if(cn&&collections[cn]){var a=collections[cn];if(a.indexOf(id)<0)a.push(id);save(LS.coll,collections);toast('已加入「'+cn+'」');openModal(id);}};
    if($('mHide'))$('mHide').onclick=function(){hideNote(id);closeModal();};
    if($('mRestore'))$('mRestore').onclick=function(){hidden.delete(id);save(LS.hid,Array.from(hidden));buildNav();render();closeModal();toast('已恢复');};
    if($('mStar'))$('mStar').onclick=function(){toggleStar(id);openModal(id);};
  }
  function closeModal(){modal.classList.remove('show');}
  modal.addEventListener('click',function(e){if(e.target===modal)closeModal();});

  /* ---------- Actions ---------- */
  function hideNote(id){hidden.add(id);save(LS.hid,Array.from(hidden));buildNav();render();toast('已标记为失效，可在「失效」中恢复');}
  function quickColl(id){if(!Object.keys(collections).length){toast('先在建合集输入框新建一个合集');return;}
    var cn=prompt('加入合集（输入已有合集名）：\n'+Object.keys(collections).join('、'));if(!cn)return;
    cn=cn.trim();if(!collections[cn])collections[cn]=[];if(collections[cn].indexOf(id)<0)collections[cn].push(id);save(LS.coll,collections);buildNav();render();toast('已加入「'+cn+'」');}
  function randomInspire(){var list=filtered();if(!list.length){toast('当前筛选没有笔记');return;}var n=list[Math.floor(Math.random()*list.length)];openModal(n.id);}
  function toggleStar(id){if(starred.has(id))starred.delete(id);else starred.add(id);save(LS.starred,Array.from(starred));buildNav();render();}
  /* ---------- Account management ---------- */
  function manageAccount(a){
    if(!a)return;
    var act=prompt('账号「'+a+'」管理\n输入数字选择：\n1 = 重命名\n2 = 合并到其它账号\n3 = 删除该账号及其笔记\n（直接取消=不操作）','');
    if(act===null)return;
    if(act==='1'){var nn=prompt('重命名为：',a);if(nn&&nn.trim()&&nn.trim()!==a)renameAccount(a,nn.trim());}
    else if(act==='2'){var others=accountList().filter(function(x){return x!==a;});var tgt=prompt('合并到哪个账号？（现有：'+(others.length?others.join('、'):'无')+'）',others[0]||'');if(tgt&&tgt.trim()&&tgt.trim()!==a)renameAccount(a,tgt.trim());}
    else if(act==='3'){var cnt=accCount(a);if(!IMPORTED.some(function(n){return n.account===a;})){toast('「'+a+'」为基础收藏库，不支持删除（可继续导入其它账号）');return;}
      if(confirm('确定删除账号「'+a+'」及其全部 '+cnt+' 篇笔记？\n删除后需从原始 CSV 重新导入才能恢复。'))deleteAccount(a);}
  }
  function renameAccount(old,neww){
    if(!neww||neww===old)return;
    var changed=0;
    IMPORTED.forEach(function(n){if(n.account===old){n.account=neww;changed++;}});
    if(changed) save(LS.imported,IMPORTED);
    else { accPatch[old]=neww; save(LS.accpatch,accPatch); }
    buildNav(); render(); toast('账号「'+old+'」→「'+neww+'」');
  }
  function deleteAccount(a){
    IMPORTED=IMPORTED.filter(function(n){return n.account!==a;});
    save(LS.imported,IMPORTED); NOTES=BASE.concat(IMPORTED);
    buildNav(); render(); toast('已删除账号「'+a+'」及其笔记');
  }

  $('bulkReclass').addEventListener('click',function(){if(!sel.size)return;var cn=prompt('重分类为：\n'+DOMAINS.map(function(d){return d.cats.join(' / ');}).join('\n'));if(!cn)return;
    if(catToDomain[cn]){sel.forEach(function(id){corrections[id]=cn;});save(LS.corr,corrections);toast('已重分类 '+sel.size+' 篇');buildNav();render();}else toast('分类名无效');});

  });
  $('bulkExport').addEventListener('click',function(){
    if(!sel.size){toast('先选择笔记（点「整理」→勾选卡片）');return;}

    var blob=new Blob([JSON.stringify(arr,null,2)],{type:'application/json'});

  });

  // tag patch store (user-added tags)
  var tagPatch = load('xhs-kb:tagpatch',{}); // {id:[tag,...]}
  function addTagsTo(idsSet,tag){idsSet.forEach(function(id){if(!tagPatch[id])tagPatch[id]=[];if(tagPatch[id].indexOf(tag)<0)tagPatch[id].push(tag);});save('xhs-kb:tagpatch',tagPatch);
    // merge into displayed notes
    NOTES.forEach(function(n){if(tagPatch[n.id])n.tags=(n.tags||[]).concat(tagPatch[n.id].filter(function(t){return (n.tags||[]).indexOf(t)<0;}));});}

  // theme
  function applyTheme(th){document.documentElement.setAttribute('data-theme',th);$('themeBtn').textContent=th==='dark'?'☀':'☾';}
  applyTheme(load(LS.theme,'light'));
  $('themeBtn').addEventListener('click',function(){var th=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';applyTheme(th);save(LS.theme,th);});

  // keyboard
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement!==$('q')){e.preventDefault();$('q').focus();}
    if(e.key==='Escape'){if(modal.classList.contains('show'))closeModal();else{$('q').blur();}}
  });

  /* ---------- CSV import (multi-account, in-browser) ---------- */
  function triggerImport(){ var fi=$('csvInput'); if(fi) fi.click(); }
  $('importTopBtn').addEventListener('click',triggerImport);
  var pendingImport=null;
  $('csvInput').addEventListener('change',function(e){
    var files=e.target.files; if(!files||!files.length)return;
    pendingImport=[]; var count=files.length, done=0;
    Array.prototype.forEach.call(files,function(f,i){
      var reader=new FileReader();
      reader.onload=function(){
        var def='号'+(i+1);
        var acc=prompt('为文件「'+f.name+'」指定小红书账号名（用于在知识库中区分来源账号）：',def);
        if(acc===null) acc=def; acc=(acc||def).trim()||def;
        var added=parseCsvText(String(reader.result),acc);
        pendingImport.push({acc:acc, notes:added});
        done++; if(done>=count) showImportPreview();
      };
      reader.onerror=function(){done++; if(done>=count) showImportPreview();};
      reader.readAsText(f,'utf-8');
    });
    e.target.value='';
  });
  function showImportPreview(){
    if(!pendingImport||!pendingImport.length){finishImport();return;}
    var ex={}; NOTES.forEach(function(n){ex[n.id]=1;}); IMPORTED.forEach(function(n){ex[n.id]=1;});
    var body='', totalNew=0, totalUpd=0;
    pendingImport.forEach(function(g){
      var cnt={new:0,upd:0}, cats={};
      g.notes.forEach(function(n){ if(!n.id){cnt.new++;return;} if(ex[n.id]){cnt.upd++;}else{cnt.new++;ex[n.id]=1;} cats[n.cat]=(cats[n.cat]||0)+1; });
      totalNew+=cnt.new; totalUpd+=cnt.upd;
      var catStr=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a];}).slice(0,6).map(function(c){return c+' '+cats[c];}).join(' · ');
      var catsHtml=catStr?catStr.split(' · ').map(function(s){return '<span>'+esc(s)+'</span>';}).join(''):'';
      body+='<div class="impAcc"><div class="h"><span class="dot" style="background:'+accColor(g.acc)+'"></span>账号：'+esc(g.acc)+'</div>'+
        '<div class="sum">新增 '+cnt.new+' 篇 · 覆盖更新 '+cnt.upd+' 篇</div>'+
        (catsHtml?'<div class="cats">'+catsHtml+'</div>':'')+'</div>';
    });
    $('impBody').innerHTML=body+'<div class="impNote">共将新增 '+totalNew+' 篇、覆盖更新 '+totalUpd+' 篇（按笔记 ID 去重）。确认后写入本地，关闭页面仍保留。</div>';
    $('impModal').classList.add('show');
  }
  $('impModal').addEventListener('click',function(e){if(e.target===this)$('impModal').classList.remove('show');});
  $('impCancel').addEventListener('click',function(){$('impModal').classList.remove('show');pendingImport=null;toast('已取消导入');});
  $('impConfirm').addEventListener('click',function(){
    $('impModal').classList.remove('show');
    var merged=[]; if(pendingImport)pendingImport.forEach(function(g){merged=merged.concat(g.notes);});
    mergeImported(merged); finishImport(); pendingImport=null;
  });
  function parseCsv(text){
    var lines=[],row=[],field='',inQ=false;
    text=text.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    for(var i=0;i<text.length;i++){var ch=text[i];
      if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){field+='"';i++;} else inQ=false; } else field+=ch; }
      else { if(ch==='"') inQ=true; else if(ch===','){row.push(field);field='';} else if(ch==='\n'){row.push(field);lines.push(row);row=[];field='';} else field+=ch; }
    }
    if(field.length||row.length){row.push(field);lines.push(row);}
    if(!lines.length)return [];
    var header=lines[0].map(function(h){return h.trim();});
    var rows=[];
    for(var r=1;r<lines.length;r++){var cells=lines[r];if(cells.length===1&&cells[0]==='')continue;
      var obj={};for(var c=0;c<header.length;c++)obj[header[c]]=cells[c]!==undefined?cells[c]:'';rows.push(obj);}
    return rows;
  }
  function parseCsvText(text,acc){var rows=parseCsv(text),out=[];rows.forEach(function(r){out.push(jsMakeNote(r,acc));});return out;}
  function mergeImported(added){var ex={};NOTES.forEach(function(n){ex[n.id]=1;});IMPORTED.forEach(function(n){ex[n.id]=1;});added.forEach(function(n){if(n.id&&!ex[n.id]){IMPORTED.push(n);ex[n.id]=1;}});}
  function finishImport(){save(LS.imported,IMPORTED);NOTES=BASE.concat(IMPORTED);buildNav();render();toast('已导入 · 共 '+IMPORTED.length+' 篇（按账号区分）');}

  /* ---------- Drawer (phone/tablet) + Cloud sync UI ---------- */
  function closeNav(){var a=document.getElementById('app');if(a)a.classList.remove('nav-open');}
  $('navToggle').addEventListener('click',function(){var a=document.getElementById('app');if(a)a.classList.toggle('nav-open');});
  $('scrim').addEventListener('click',closeNav);
  $('nav').addEventListener('click',function(e){if(e.target.closest('.navitem')||e.target.closest('.grp-head'))closeNav();});
  function syncMsg(t){var m=document.getElementById('syncMsg');if(m)m.textContent=t;}
  function openSync(){ $('ghRepo').value=ghRepo; $('ghBranch').value=ghBranch; $('ghToken').value=ghToken; $('ghPass').value=ghPass; setSyncStatus(syncReady()?'已连接':'未配置'); $('syncModal').classList.add('show'); }
  $('syncBtn').addEventListener('click',openSync);
  $('syncClose').addEventListener('click',function(){$('syncModal').classList.remove('show');});
  $('syncModal').addEventListener('click',function(e){if(e.target===this)$('syncModal').classList.remove('show');});
  $('syncSave').addEventListener('click',function(){
    ghRepo=$('ghRepo').value.trim(); ghBranch=$('ghBranch').value.trim()||'main'; ghToken=$('ghToken').value.trim(); ghPass=$('ghPass').value.trim();
    if(!syncReady()){syncMsg('请完整填写仓库 / Token / 口令');return;}
    _save(LSync.repo,ghRepo); _save(LSync.branch,ghBranch); _save(LSync.token,ghToken); _save(LSync.pass,ghPass); _save(LSync.sha,''); syncMsg('已保存，正在上推…'); pushSync();
  });
  $('syncNow').addEventListener('click',function(){ if(!syncReady()){syncMsg('请先保存连接');return;} pullSync(true).then(pushSync); });
  $('syncDisconnect').addEventListener('click',function(){ ghRepo=ghBranch=ghToken=ghPass=''; _save(LSync.repo,''); _save(LSync.branch,''); _save(LSync.token,''); _save(LSync.pass,''); _save(LSync.sha,''); setSyncStatus('已断开'); syncMsg('已断开云同步（本机数据保留）'); });
  setSyncStatus(syncReady()?'已连接':'未配置');
  if(syncReady()){ pullSync(false); }
  setInterval(function(){ if(syncReady()) pullSync(false); }, 60000);

  buildNav(); render();
})();
</script>
</body>
</html>
